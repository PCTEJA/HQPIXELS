# =============================================================================
# HQPixels — Supabase Local Configuration
# =============================================================================
# This file configures Supabase CLI for local development.
# See: https://supabase.com/docs/guides/cli/config
# =============================================================================

[project]
id = "hqpixels-local"
name = "HQPixels"

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------
[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.dev.sql"]

# -----------------------------------------------------------------------------
# API (PostgREST)
# -----------------------------------------------------------------------------
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# -----------------------------------------------------------------------------
# Auth (GoTrue)
# -----------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

[auth.email.template.invite]
subject = "You have been invited to HQPixels"

[auth.email.template.confirmation]
subject = "Confirm your HQPixels signup"

[auth.email.template.recovery]
subject = "Reset your HQPixels password"

[auth.email.template.email_change]
subject = "Confirm your HQPixels email change"

# Disable external OAuth providers for local dev
[auth.external.apple]
enabled = false
[auth.external.azure]
enabled = false
[auth.external.bitbucket]
enabled = false
[auth.external.discord]
enabled = false
[auth.external.facebook]
enabled = false
[auth.external.github]
enabled = false
[auth.external.gitlab]
enabled = false
[auth.external.google]
enabled = false
[auth.external.keycloak]
enabled = false
[auth.external.linkedin]
enabled = false
[auth.external.linkedin_oidc]
enabled = false
[auth.external.notion]
enabled = false
[auth.external.slack]
enabled = false
[auth.external.spotify]
enabled = false
[auth.external.twitch]
enabled = false
[auth.external.twitter]
enabled = false
[auth.external.workos]
enabled = false
[auth.external.zoom]
enabled = false

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
[storage]
enabled = true
file_size_limit = "5MB"

[storage.buckets.images]
public = false
file_size_limit = "2MB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif"]

# -----------------------------------------------------------------------------
# Realtime
# -----------------------------------------------------------------------------
[realtime]
enabled = false

# -----------------------------------------------------------------------------
# Studio
# -----------------------------------------------------------------------------
[studio]
enabled = true
port = 54323
api_url = "http://localhost"

# -----------------------------------------------------------------------------
# Inbucket (local email testing)
# -----------------------------------------------------------------------------
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------
[analytics]
enabled = false

# -----------------------------------------------------------------------------
# Experimental
# -----------------------------------------------------------------------------
[experimental]
oriole_db = false
